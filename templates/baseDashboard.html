<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title%} {% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/output.css') }}"
    />
    <style>
      .card-hover {
        transition: all 0.3s ease;
      }

      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.1),
          0 8px 10px -6px rgb(0 0 0 / 0.1);
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-purple-50 via-white to-blue-50 min-h-screen"
  >
    <!-- Navigation -->
    <nav class="bg-white border-b sticky top-0 z-50 shadow-sm">
      <div class="sm:px-3">
        <div class="flex justify-between items-center h-16">
          <!-- Dashboard-Logo -->
          <div class="flex items-center">
            <!-- Mobile SideBar -->
            <button
              id="mobileMenuBtn"
              class="lg:hidden p-2 rounded-lg hover:bg-gray-100"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-6 h-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>
            <!-- ContentForgeAI Logo -->
            <div class="flex items-center gap-2 cursor-pointer mt-2">
              <svg
                width="280"
                height="52"
                viewBox="0 0 280 55"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <!-- Layered Content Sheets -->
                <rect
                  x="6"
                  y="12"
                  width="28"
                  height="28"
                  rx="6"
                  stroke="#050040"
                  stroke-width="2.5"
                />

                <rect
                  x="12"
                  y="8"
                  width="28"
                  height="28"
                  rx="6"
                  stroke="#050040"
                  stroke-width="2.5"
                />

                <!-- Forge Spark (AI Core) -->
                <path d="M26 16 L30 24 L22 24 Z" fill="#050040" />

                <circle cx="26" cy="28" r="2.5" fill="#050040" />

                <!-- Brand Name -->
                <text
                  x="45"
                  y="33"
                  font-family="Poppins, sans-serif"
                  font-size="22"
                  font-weight="600"
                  fill="#050040"
                >
                  ContentForgeAI
                </text>
              </svg>
            </div>
          </div>

          <!-- Dashboard-Profile -->
          <div class="flex items-center gap-2 pr-3">
            <a
              href="{{ url_for('signout') }}"
              class="p-2 rounded-full hover:bg-gray-100"
            >
              <img
                src="{{ url_for('static', filename='/images/signout.svg' ) }}"
                alt="signout"
                class="w-6 h-6"
              />
            </a>
            <a
              href="{{ url_for('home') }}"
              class="p-2 rounded-full hover:bg-gray-100"
            >
              <img
                src="./static/images/home-icon.svg"
                alt="home-icon"
                class="w-6 h-6"
              />
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main-Content-And-Sidebar-Section -->
    <div class="flex">
      <!-- Sidebar-Desktop -->
      <aside
        id="sidebar"
        class="sidebar hidden lg:block w-72 bg-white border-r min-h-[calc(100vh-4rem)] shadow-sm fixed lg:relative z-40"
      >
        <div class="p-6">
          <!-- Navigation Section -->
          <div class="mb-8">
            <h3
              class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4 font-poppins"
            >
              Navigation
            </h3>
            <!-- Dashboard-text -->
            <div class="space-y-1">
              <a
                href="{{ url_for('dashboard') }}"
                class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg bg-gradient-to-r from-indigo-600 to-pink-400"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5"
                  fill="#fff"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zM14 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1v-3z"
                  />
                </svg>
                <span class="font-medium text-white">Dashboard</span>
              </a>
            </div>
          </div>

          <!-- AI Tools Section -->
          <div class="mb-8">
            <h3
              class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4"
            >
              AI Tools
            </h3>
            <div class="space-y-1">
              <!-- Short-Reel-Generator -->
              <a
                href="{{url_for('shortReelGen')}}"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:text-gray-600"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                  />
                </svg>
                <span class="font-medium">Short Reel Generator</span>
              </a>
              <!-- Blog-Generator -->
              <a
                href="{{url_for('blogGenerator')}}"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:text-gray-600"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                  ></path>
                </svg>
                <span class="font-medium">Blog Generator</span>
              </a>
              <!-- Captions-Generator -->
              <a
                href="{{url_for('captionGenerator')}}"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:text-gray-600"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"
                  />
                </svg>
                <span class="font-medium">Captions Generator</span>
              </a>
              <!-- Hashtag-Generator -->
              <a
                href="{{url_for('hashtagGenerator')}}"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:text-gray-600"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"
                  />
                </svg>
                <span class="font-medium">Hashtag Generator</span>
              </a>
              <!-- Video-Scripts-Generator -->
              <a
                href="{{url_for('videoScriptsGen')}}"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:text-gray-600"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                  />
                </svg>
                <span class="font-medium">Video Scripts Generator</span>
              </a>
            </div>
          </div>

          <!-- Other Options -->
          <div class="border-t pt-6">
            <div class="space-y-1">
              <a
                href="{{ url_for('reel_history') }}"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:text-gray-600"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                  />
                </svg>
                <span class="font-medium"> Reel History</span>
              </a>
            </div>

            <div class="space-y-1">
              <a
                href="{{ url_for('history') }}"
                class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:text-gray-600"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  fill="currentColor"
                  class="bi bi-hourglass-split"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M2.5 15a.5.5 0 1 1 0-1h1v-1a4.5 4.5 0 0 1 2.557-4.06c.29-.139.443-.377.443-.59v-.7c0-.213-.154-.451-.443-.59A4.5 4.5 0 0 1 3.5 3V2h-1a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1h-1v1a4.5 4.5 0 0 1-2.557 4.06c-.29.139-.443.377-.443.59v.7c0 .213.154.451.443.59A4.5 4.5 0 0 1 12.5 13v1h1a.5.5 0 0 1 0 1zm2-13v1c0 .537.12 1.045.337 1.5h6.326c.216-.455.337-.963.337-1.5V2zm3 6.35c0 .701-.478 1.236-1.011 1.492A3.5 3.5 0 0 0 4.5 13s.866-1.299 3-1.48zm1 0v3.17c2.134.181 3 1.48 3 1.48a3.5 3.5 0 0 0-1.989-3.158C8.978 9.586 8.5 9.052 8.5 8.351z"
                  />
                </svg>
                <span class="font-medium"> History</span>
              </a>
            </div>
          </div>
        </div>
      </aside>

      <!-- Mobile Sidebar Overlay -->
      <div
        id="overlay"
        class="hidden fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden"
      ></div>

      <!-- Main Content -->
      <!-- This is Flask Jinja 2 Template where base.html act as template inheritance  -->
      <!-- This block content and endblock act as template inheritance which create a section that allows other templates fill there content in this area, used when some visual part of the webpage
      same in every other webpage -->
      {% block content %} {% endblock %}
    </div>

    <!-- Global Javascript -->
    <script src="{{ url_for('static', filename='js/baseTemplate.js') }}"></script>

    <!-- Page-specific Javascript -->
    {% block js %}{% endblock %}
  </body>
</html>
