<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} {% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/output.css')}}"
    />
  </head>
  <body>
    <section>
      <div>
        <div
          class="grid lg:grid-cols-2 gap-4 max-lg:gap-12 bg-gradient-to-r from-indigo-600 to-pink-400 sm:px-8 px-4 py-12 h-[320px] font-poppins"
        >
          <!-- Heading -->
          <div>
            <a href="{{url_for('home')}}" class=""
              ><svg
                width="280"
                height="60"
                viewBox="0 0 280 60"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <!-- Layered Content Sheets -->
                <rect
                  x="6"
                  y="12"
                  width="28"
                  height="28"
                  rx="6"
                  stroke="#fff"
                  stroke-width="2.5"
                />
                <rect
                  x="12"
                  y="8"
                  width="28"
                  height="28"
                  rx="6"
                  stroke="#fff"
                  stroke-width="2.5"
                />

                <!-- Forge Spark -->
                <path d="M26 16 L30 24 L22 24 Z" fill="#fff" />
                <circle cx="26" cy="28" r="2.5" fill="#fff" />

                <!-- Main Title -->
                <text
                  x="45"
                  y="28"
                  font-family="Poppins, sans-serif"
                  font-size="22"
                  font-weight="600"
                  fill="#fff"
                >
                  ContentForgeAI
                </text>

                <!-- 🔥 Subtitle (NO GAP, SMALL) -->
                <text
                  x="45"
                  y="42"
                  font-family="Poppins, sans-serif"
                  font-size="10"
                  fill="#ffffffcc"
                >
                  AI Powered Content Creation
                </text>
              </svg>
            </a>
            <div class="max-w-lg mt-16 max-lg:hidden">
              <h1 class="text-4xl font-semibold text-white">
                {% block heading %} {% endblock %}
              </h1>
              <p class="text-[15px] mt-4 text-slate-100 leading-relaxed">
                Access your AI-powered workspace and continue creating
                high-quality content with ease and efficiency.
              </p>
            </div>
          </div>

          <!-- Sign-In/Sign-up -->
          {% block content%} {% endblock %}
        </div>
      </div>
    </section>
  </body>
</html>
